version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: feedback_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: feedback_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: feedback_ai_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: feedback_ai_backend
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/feedback_ai?schema=public
      JWT_SECRET: feedback_ai_production_secret_key_change_me_before_deploy
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: gemini-3.8-flash
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY}
      HINDSIGHT_BANK: feedback-ai-engineering-memory
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:80
    depends_on:
      - postgres
      - redis
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: feedback_ai_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
